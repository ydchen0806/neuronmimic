[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronmimic"
version = "0.1.0"
description = "Directed, physics-guided neural dynamics calibration baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "pandas>=2.0", "pyarrow>=11"]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
